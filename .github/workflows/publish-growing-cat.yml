name: Publish Growing Cat v2.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-growing-cat.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growing-cat-v2-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build Windows EXE and replace legacy release
    runs-on: windows-latest
    steps:
      - name: Check out latest source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install pygame pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name growing-cat --add-data "assets;assets" app.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          if (-not (Test-Path 'dist/growing-cat.exe')) { throw 'Executable missing' }
          if ((Get-Item 'dist/growing-cat.exe').Length -le 0) { throw 'Executable is empty' }

      - name: Publish v2.0.0 and delete v1.9 only on success
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @'
          ## Growing Cat v2.0.0
          
          v1.9 이후의 기능 추가 및 개선 사항을 반영한 Windows 버전입니다.
          
          - 고양이 기분, 성격, 친밀도 및 특별 돌봄 시스템
          - 일일 미션, 랜덤 이벤트, 육성 및 성장 기록
          - 미니게임 5종, 도전 모드, 기록 및 도전 과제
          - 대회 리그, 트로피 도감, 업적 확장
          - 포토 모드, 앨범, 시작 및 일시정지 화면
          - 이미지 로딩/성능 개선과 게임 밸런스 조정
          - 저장 보호 강화 및 기존 세이브 호환성 개선
          
          Windows에서 growing-cat.exe를 다운로드해 실행하세요.
          기존 저장 데이터는 %APPDATA%/growing-cat/에 유지됩니다.
          '@
          $notes | Set-Content -Path release-notes.md -Encoding utf8

          gh release view v2.0.0 --json tagName 2>$null | Out-Null
          $existing = ($LASTEXITCODE -eq 0)
          if ($existing) {
            gh release upload v2.0.0 'dist/growing-cat.exe' --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to replace v2.0.0 binary' }
            gh release edit v2.0.0 --title 'Growing Cat v2.0.0' --notes-file 'release-notes.md' --latest
          } else {
            gh release create v2.0.0 'dist/growing-cat.exe' --target "$env:GITHUB_SHA" --title 'Growing Cat v2.0.0' --notes-file 'release-notes.md' --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish v2.0.0; old release was preserved' }

          $assetNames = @(gh release view v2.0.0 --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0 -or $assetNames -notcontains 'growing-cat.exe') {
            throw 'Published release has no executable; old release was preserved'
          }

          gh release view cat --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete cat --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw 'New release published, but old release cleanup failed' }
          }
          else {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/cat" 2>$null | Out-Null
          }
